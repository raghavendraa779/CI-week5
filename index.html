<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Event Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <h1>DevOps Event Registration</h1>
        <p>Register for the DevOps Laboratory Event</p>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="college">College</label>
            <input type="text" id="college" placeholder="Enter your college" required>

            <label for="event">Select Event</label>
            <select id="event" required>
                <option value="">-- Select Event --</option>
                <option value="DevOps Workshop">DevOps Workshop</option>
                <option value="Docker Workshop">Docker Workshop</option>
                <option value="Kubernetes Workshop">Kubernetes Workshop</option>
            </select>

            <button type="submit">Register</button>

        </form>

        <p id="message"></p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
